[project]
name = "nomadquant"
version = "0.1.0"
description = "Locally hosted, paper-only research foundation for algorithmic trading."
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12"
authors = [{ name = "NomadQuant contributors" }]
dependencies = [
    "alpaca-py>=0.39",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
nomadquant-api = "nomadquant.cli:main"
nomadquant-data = "nomadquant.marketdata.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomadquant"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["nomadquant", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["nomadquant"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alpaca.*", "exchange_calendars", "exchange_calendars.*", "pandas"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
